[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quorum"
version = "0.1.0.dev1"
description = "A Raft-based distributed key-value store in Python, built around deterministic simulation and fault-injection testing (Milestone 1 of 17)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorum = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
files = ["src", "sim", "tests", "demo"]
explicit_package_bases = true
namespace_packages = true
warn_unreachable = true
